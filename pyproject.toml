[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wgw898-segmodel_jd347"
version = "0.1.0"
description = "从样本里推断图像分割研究员·越狱模板的变体识别应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "wgw898" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://wgw898.github.io"
Repository = "https://github.com/wgw898/segmodel_jd347"
Issues = "https://github.com/wgw898/segmodel_jd347/issues"

[project.scripts]
segmodel_jd347 = "segmodel_jd347:main"

[tool.setuptools]
py-modules = ["segmodel_jd347"]
